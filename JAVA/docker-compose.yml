version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: gerdau_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: gerdau_db
    volumes:
      - mongodb_data:/data/db

  backend:
    build: .
    container_name: gerdau_app_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/gerdau_db
    depends_on:
      - mongodb

volumes:
  mongodb_data:
