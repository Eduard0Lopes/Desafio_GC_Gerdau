spring.application.name=desafio

# =============================================================================
# MongoDB — valor-padrão = cluster compartilhado do projeto ("clone e rode").
# Para outro banco, defina a variável de ambiente MONGODB_URI.
# (as duas chaves são mantidas por compatibilidade entre versões do Spring Data)
# =============================================================================
spring.mongodb.uri=${MONGODB_URI:mongodb+srv://gerdau_mvp_user:gerdaumvp2026@cluster0.fsmqcef.mongodb.net/gerdau_prototipo?retryWrites=true&w=majority}
spring.mongodb.database=${MONGODB_DATABASE:gerdau_prototipo}
spring.data.mongodb.uri=${spring.mongodb.uri}
spring.data.mongodb.database=${spring.mongodb.database}

# =============================================================================
# Carga dos dados oficiais (Time de IA) — merge de base_saneada × matriz_de_para
# =============================================================================
# Diretório das planilhas oficiais (leitura apenas — nunca é alterado)
app.seed.planilhas=${SEED_DIR:../IA/data/processed}
# true = popula as coleções na primeira subida (idempotente, só insere o que falta)
app.seed.enabled=${SEED_ENABLED:true}

# =============================================================================
# Motor de similaridade (calibração da trilha IA: 0,88 duplicidade / 0,70 alerta)
# =============================================================================
similaridade.limiar-duplicidade=${SIMILARITY_LIMIAR_DUPLICIDADE:0.88}
similaridade.limiar-alerta=${SIMILARITY_LIMIAR_ALERTA:0.70}
similaridade.score-minimo=${SIMILARITY_SCORE_MINIMO:0.30}
# local = motor Java (padrão) | python = motor do Time de IA em runtime
similaridade.motor=${SEARCH_ENGINE:local}
similaridade.python.url=${SIMILARITY_PYTHON_URL:http://localhost:8001}
# enforce = bloqueia duplicidades sem justificativa | observe = apenas registra
similaridade.modo=${SIMILARITY_ENFORCEMENT:enforce}

# =============================================================================
# Índices (documento técnico, seção 14.3) e Swagger
# =============================================================================
app.mongo.ensure-indexes=${ENSURE_INDEXES:true}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
