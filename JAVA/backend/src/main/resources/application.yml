# ---------------------------------------------------------------------------
# Configuração da API. NADA de segredo aqui: tudo vem de variáveis de ambiente
# (arquivo .env na raiz do projeto — veja docs/COMO-RODAR.md).
# ---------------------------------------------------------------------------
spring:
  application:
    name: gerdau-servicos-api
  # Permite rodar fora do Docker (mvn spring-boot:run dentro de backend/) lendo o
  # MESMO .env usado pelo docker compose. No Docker o arquivo não existe -> ignorado.
  config:
    import: "optional:file:../.env[.properties]"
  data:
    mongodb:
      # A URI inclui o nome do banco: mongodb+srv://usuario:senha@cluster/BANCO?opcoes
      uri: ${MONGODB_URI}
      # Índices são criados de forma explícita pelo MongoIndexInitializer (controlável).
      auto-index-creation: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

app:
  search:
    engine: ${SEARCH_ENGINE:local}              # local | atlas
    atlas-index-name: ${ATLAS_SEARCH_INDEX:default}
  similarity:
    enforcement: ${SIMILARITY_ENFORCEMENT:enforce}   # observe | enforce
    alert-threshold: ${SIMILARITY_ALERT_THRESHOLD:0.75}
    block-threshold: ${SIMILARITY_BLOCK_THRESHOLD:0.90}
    candidate-pool: 200
  ids:
    gs-width: 3
    cf-width: 3
    cs-width: 6
    um-width: 2
  limits:
    descricao-max: 40     # limite do SAP
    nome-max: 100
  security:
    dev-password: ${APP_DEV_PASSWORD:}
    roles-claim: roles
  audit:
    record-ip: ${AUDIT_RECORD_IP:false}
  maintenance:
    ensure-indexes: ${ENSURE_INDEXES:true}
    backfill-normalized: ${BACKFILL_NORMALIZED:false}
    startup-diagnostics: true
